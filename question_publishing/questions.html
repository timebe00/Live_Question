<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>문제 생성</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/question-form.css">
</head>

<body>
    <main class="page">
        <div class="container">
            <header class="header">
                <div>
                    <div class="brand"><span class="brand-mark"></span><span id="masterName">문제 마스터</span></div>
                    <h1 class="title">문제 생성 페이지</h1>
                    <p class="subtitle">N지선다형 문제를 만들고, 드래그 앤 드랍으로 문제 순서를 변경합니다.</p>
                </div>
                <div class="nav-actions"><button class="btn primary" id="addQuestionBtn">새 문제 추가</button><a
                        class="btn ghost" href="master.html">마스터 목록</a></div>
            </header>
            <section class="question-editor">
                <aside class="card card-pad">
                    <div class="toolbar"><strong>문제 목록</strong><span class="badge">드래그 정렬</span></div>
                    <div class="question-list" id="questionList"></div>
                </aside>
                <section class="card card-pad">
                    <div id="editorEmpty">
                        <h2 class="title">문제를 선택하거나 추가하세요.</h2>
                    </div>
                    <form id="editorForm" style="display:none">
                        <div class="field"><label>문제</label><textarea id="questionText" required
                                placeholder="문제를 입력하세요"></textarea></div>
                        <div class="answer-help">정답은 문제 입력과 별도의 input 값으로 받습니다. 정답 번호는 반드시 1개만 선택됩니다.</div>
                        <div class="grid two">
                            <div class="field"><label>정답 번호</label><input id="correctAnswer" type="number" min="1"
                                    required></div>
                            <div class="field"><label>문항 관리</label><button class="btn ghost" id="addOptionBtn"
                                    type="button">문항 추가</button></div>
                        </div>
                        <div id="optionRows"></div>
                        <div class="button-row"><button class="btn primary" type="submit">문제 저장</button><button
                                class="btn danger" id="deleteQuestionBtn" type="button">현재 문제 삭제</button></div>
                    </form>
                </section>
            </section>
        </div>
    </main>
    <script src="js/app.js"></script>
    <script src="js/questions.js"></script>
</body>

</html>
