<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>로그인</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/login.css">
</head>

<body>
    <main class="login-page">
        <section class="login-box">
            <div class="brand login-logo"><span class="brand-mark"></span><span>Live Question</span></div>
            <div class="card login-card">
                <h1 class="login-title">관리자 로그인</h1>
                <p class="login-desc">아이디와 비밀번호를 입력하면 문제 마스터 생성 페이지로 이동합니다.</p>
                <form id="loginForm">
                    <div class="field"><label>아이디</label><input required placeholder="아이디 입력"></div>
                    <div class="field"><label>비밀번호</label><input required type="password" placeholder="비밀번호 입력"></div>
                    <button class="btn primary" type="submit">로그인</button>
                </form>
                <div class="hint">데모 화면이므로 아무 값이나 입력해도 이동됩니다.</div>
            </div>
        </section>
    </main>
    <script src="js/app.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
