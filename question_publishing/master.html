<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>문제 마스터</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/master.css">
</head>

<body>
    <main class="page">
        <div class="container">
            <header class="header">
                <div>
                    <div class="brand"><span class="brand-mark"></span><span>Live Question</span></div>
                    <h1 class="title">문제 마스터 생성 페이지</h1>
                    <p class="subtitle">행사, 강의, 세션 단위로 문제 묶음을 만들고 관리합니다.</p>
                </div>
                <div class="nav-actions"><button class="btn primary" id="newMasterBtn">문제 마스터 생성</button><a
                        class="btn ghost" href="login.html">로그아웃</a></div>
            </header>
            <section class="master-summary">
                <div class="card summary-card">
                    <div class="summary-num" id="totalMasters">0</div>
                    <div class="summary-label">문제 마스터</div>
                </div>
                <div class="card summary-card">
                    <div class="summary-num" id="totalQuestions">0</div>
                    <div class="summary-label">전체 문제</div>
                </div>
                <div class="card summary-card">
                    <div class="summary-num" id="totalResponses">0</div>
                    <div class="summary-label">전체 답안</div>
                </div>
            </section>
            <section class="card">
                <div class="table-wrap">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>문제 마스터</th>
                                <th>문제 수</th>
                                <th>생성일</th>
                                <th>관리</th>
                            </tr>
                        </thead>
                        <tbody id="masterRows"></tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>
    <div class="modal" id="masterModal">
        <div class="modal-panel">
            <div class="modal-head">
                <h2>문제 마스터</h2><button class="close" onclick="closeModal('masterModal')">×</button>
            </div>
            <form id="masterForm"><input type="hidden" id="masterId">
                <div class="field"><label>제목</label><input id="masterTitle" required placeholder="예: 제22차 기능검사 워크샵">
                </div>
                <div class="field"><label>설명</label><textarea id="masterDesc" placeholder="문제 마스터 설명"></textarea></div>
                <div class="button-row"><button class="btn primary" type="submit">저장</button><button class="btn ghost"
                        type="button" onclick="closeModal('masterModal')">취소</button></div>
            </form>
        </div>
    </div>
    <script src="js/app.js"></script>
    <script src="js/master.js"></script>
</body>

</html>
